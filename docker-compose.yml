# ══════════════ LO QUE SKYWAY CONSTRUYE Y ARRANCA ═════════════════════════════
#
# Skyway lee este fichero: construye el `Dockerfile` con `build: .` e inyecta las
# variables desde su panel. Aquí dentro está **solo la aplicación**, porque el
# Postgres lo pone Skyway y su URL interna llega por `DATABASE_URL`.
#
# El Postgres para trabajar en local vive al lado, en `docker-compose.local.yml`.
# Están separados por dos motivos medidos contra un Compose de verdad, no por
# gusto:
#
#  1. **`${POSTGRES_PASSWORD:?falta …}` rompe el fichero ENTERO**, aunque el
#     servicio que la usa no se vaya a arrancar: la interpolación se evalúa antes
#     que nada y responde «required variable is missing a value». Con el Postgres
#     local aquí dentro, desplegar contra la base gestionada de Skyway obligaría a
#     inventarse una contraseña para un servicio que nadie usa —o a quitar la
#     comprobación y quedarse con una por defecto, que es peor: una base con
#     credencial conocida y en silencio—.
#  2. **`profiles: ["local"]` no lo salva.** En cuanto el perfil no está activo,
#     `docker compose config` responde «service "app" depends on undefined service
#     "db"». Un `depends_on` y un perfil no se llevan.
#
# ── Cómo se despliega ──
#
#   1. Conectar el repositorio en Skyway. Reconstruye en cada push.
#   2. Añadir su Postgres gestionado y poner su URL interna en `DATABASE_URL`,
#      con `?connection_limit=10` al final: sin ese tope Prisma abre
#      `núcleos × 2 + 1` conexiones y agota el cupo de una base pequeña.
#   3. El resto de variables, en el panel. Están todas en `.env.example`.
#   4. `npm run bot:configurar` desde un clon, con `APP_URL` apuntando ya al
#      dominio. No se puede lanzar dentro del contenedor: la imagen final no
#      copia `scripts/`.
#   5. Las líneas de cron de `.env.example`. La que no puede faltar es la de las
#      **16:05 UTC**: Sophon cierra su día a las 00:00 UTC+8 y es entonces cuando
#      hay cifras nuevas que leer.
#
# Las migraciones NO se lanzan a mano en ningún caso: el `CMD` de la imagen
# ejecuta `prisma migrate deploy` antes de servir. Y hace falta **también** en
# una base vacía, porque es lo que crea las tablas: sin ella la aplicación
# arranca y toda consulta falla.
#
# ── Y en local ──
#
#   cp .env.example .env   y rellenarlo
#   npm run docker:local   ← levanta este fichero MÁS el Postgres de al lado
#
# ── Por qué un solo servicio ──
#
# El bot NO es un servicio aparte —vive dentro de la aplicación, en `/api/bot`,
# porque funciona por webhook y no por polling— y el planificador tampoco: las
# tareas de sincronización se disparan contra `/api/cron` desde fuera. Un
# contenedor por cosa que no necesita contenedor propio es coste de operación
# sin nada a cambio.

services:
  app:
    build: .
    restart: unless-stopped
    # `env_file` y no una lista de `environment`: cada variable enumerada aquí
    # sería una que hay que acordarse de añadir en dos sitios el día que se sume
    # una nueva, y la que se olvide fallará en producción y no en local.
    #
    # Y en forma larga con `required: false` porque **`.env` está en
    # `.gitignore`**: en el clon que hace Skyway ese fichero no existe, y la
    # forma corta (`env_file: .env`) aborta con «env file not found» antes de
    # construir nada. En local sí existe y se lee. Necesita Compose ≥ 2.24; si tu
    # Skyway trae uno anterior, el error dirá que `path` no es válido ahí.
    env_file:
      - path: .env
        required: false
    environment:
      # El reloj del contenedor va en UTC y el reparto por día lo hace la
      # aplicación con `ZONA_HORARIA` (hoy UTC+8, la zona de Sophon). Son dos
      # cosas distintas a propósito: si el contenedor tuviera su propia zona
      # habría dos respuestas a «¿de qué día es este devengo?».
      TZ: UTC
    # Sin `ports`: quien publica es el Traefik de Skyway, y abrir el 3000 al
    # anfitrión dejaría la aplicación accesible por HTTP saltándose el proxy —y
    # con él el TLS que Telegram exige para las Mini Apps—.
    expose:
      - "3000"
    labels:
      traefik.enable: "true"
      traefik.http.services.sophon-promoters.loadbalancer.server.port: "3000"
      # ⚠️ AQUÍ FALTA EL ENRUTADOR, y falta a sabiendas. Un `rule=Host(...)` va
      # acompañado de `entrypoints` y `certresolver`, y esos dos nombres son de
      # la instalación de Traefik, no del proyecto: ponerlos a ojo daría un
      # servicio que Traefik ve y no publica, o que publica sin TLS —y sin TLS
      # Telegram no abre la Mini App—.
      #
      # Si Skyway no monta el enrutador solo a partir del dominio de su panel,
      # se añaden aquí tres etiquetas con los nombres reales de tu instalación:
      #   traefik.http.routers.sophon-promoters.rule: Host(`promoters.example.com`)
      #   traefik.http.routers.sophon-promoters.entrypoints: <el de HTTPS>
      #   traefik.http.routers.sophon-promoters.tls.certresolver: <el tuyo>
